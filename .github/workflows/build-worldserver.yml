name: Build patched worldserver
# Builds the same Windows world server the CF-Server-Manager installs (same core, CoA bots,
# Content Scaling and SQUID's Playerbots commits, same build settings), with the patches in
# patches/ applied, and publishes it as a release of this repository ready for the VM.
# Runs by itself every day for the manager's newest release, and only builds a release once;
# patch night on the VM installs it. Run it by hand from the Actions tab for a specific release.
on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC daily, about 2:17 pm in Sydney
  workflow_dispatch:
    inputs:
      release:
        description: 'Manager server release to match, for example server-0.261028.83 (or "latest")'
        default: latest
      rebuild:
        description: 'Build even if this release was built before'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-worldserver
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.decide.outputs.build }}
      tag: ${{ steps.lock.outputs.tag }}
      core_sha: ${{ steps.lock.outputs.core_sha }}
      bots_sha: ${{ steps.lock.outputs.bots_sha }}
      scaling_sha: ${{ steps.lock.outputs.scaling_sha }}
      squid_sha: ${{ steps.lock.outputs.squid_sha }}
      squid_tag: ${{ steps.lock.outputs.squid_tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Look up the release's exact commits
        id: lock
        run: python3 -I scripts/resolve_release.py "${{ inputs.release || 'latest' }}"
      - name: Build only releases not built before
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.lock.outputs.tag }}
          REBUILD: ${{ inputs.rebuild || false }}
        run: |
          if [ "$REBUILD" = "true" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if gh release list --repo "${{ github.repository }}" --limit 200 --json tagName --jq '.[].tagName' | grep -q "^wcme-$TAG-"; then
            echo "$TAG is already built; nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 340
    env:
      BOOST_ROOT: C:\local\boost_1_87_0
    steps:
      - name: Keep line endings as they are in the repositories
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: This repository (patches, addon, install scripts)
        uses: actions/checkout@v7
        with:
          path: _mine

      - name: Core at the release commit
        uses: actions/checkout@v7
        with:
          repository: Corfirean/azerothcore-wotlk-coa
          ref: ${{ needs.check.outputs.core_sha }}
          path: core
          fetch-depth: 1

      - name: Apply our patches
        shell: pwsh
        working-directory: core
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($patch in Get-ChildItem ../_mine/patches -Filter *.patch | Sort-Object Name) {
            git apply --check --whitespace=nowarn $patch.FullName
            if ($LASTEXITCODE) {
              throw "$($patch.Name) no longer fits release ${{ needs.check.outputs.tag }}. The patch needs refreshing for this core."
            }
            git apply --whitespace=nowarn $patch.FullName
            if ($LASTEXITCODE) { throw "Applying $($patch.Name) failed." }
            Write-Host "Applied $($patch.Name)"
          }
          git diff --stat

      - name: CoA bots module
        uses: actions/checkout@v7
        with:
          repository: Corfirean/mod-coa-playerbots
          ref: ${{ needs.check.outputs.bots_sha }}
          path: _bots

      - name: Content Scaling module
        uses: actions/checkout@v7
        with:
          repository: Corfirean/mod-coa-content-scaling
          ref: ${{ needs.check.outputs.scaling_sha }}
          path: _scaling

      - name: SQUID's Playerbots, unchanged
        uses: actions/checkout@v7
        with:
          repository: Zyth45/mod-playerbots
          ref: ${{ needs.check.outputs.squid_sha }}
          path: core/modules/mod-playerbots

      - name: AI chat for bots (mod-ollama-chat, pinned; off until its config enables it)
        uses: actions/checkout@v7
        with:
          repository: DustinHendrickson/mod-ollama-chat
          ref: 906eb2a45f5b3b815a281977005371193517eb32
          path: core/modules/mod-ollama-chat

      - name: Fit mod-ollama-chat to the CoA core (its WorldSession::IsHeadless is IsBot here)
        shell: pwsh
        run: |
          $file = 'core/modules/mod-ollama-chat/src/mod-ollama-chat_world.cpp'
          $text = Get-Content $file -Raw
          if ($text -notmatch 'session->IsHeadless\(\)') { throw 'mod-ollama-chat changed: IsHeadless call not found' }
          Set-Content $file ($text -replace 'session->IsHeadless\(\)', 'session->IsBot()') -NoNewline

      - name: Bot levels near real players (AiPlayerbot.WildcardLevelNearPlayersPct, off at 0)
        shell: pwsh
        run: |
          $file = 'core/modules/mod-playerbots/src/Bot/RandomPlayerbotMgr.cpp'
          $text = Get-Content $file -Raw
          $roll = "        uint32 roll = urand(1, 100);`n        if (roll <= 100 * sPlayerbotAIConfig.randomBotMaxLevelChance)"
          $text = $text -replace "`r`n", "`n"
          if (-not $text.Contains($roll)) { throw 'SQUID changed: the level roll in RandomizeFirst was not found' }
          if (-not $text.Contains('#include "Player.h"')) { throw 'SQUID changed: #include "Player.h" not found' }
          $near = @'
                  uint32 roll = urand(1, 100);
                  uint32 wildcardNearLevel = 0;
                  uint32 wildcardNearPct = sConfigMgr->GetOption<uint32>("AiPlayerbot.WildcardLevelNearPlayersPct", 0);
                  if (wildcardNearPct && urand(1, 100) <= wildcardNearPct)
                  {
                      std::vector<uint32> realLevels;
                      for (Player* real : players)
                          if (real && real->IsInWorld() && real->GetSession() && !real->GetSession()->IsBot())
                              realLevels.push_back(real->GetLevel());
                      if (!realLevels.empty())
                      {
                          uint32 centre = realLevels[urand(0, realLevels.size() - 1)];
                          uint32 low = std::max(minLevel, centre > 5 ? centre - 5 : 1u);
                          uint32 high = std::min(maxLevel, centre + 5);
                          if (low <= high)
                              wildcardNearLevel = urand(low, high);
                      }
                  }
                  if (wildcardNearLevel)
                  {
                      level = wildcardNearLevel;
                  }
                  else if (roll <= 100 * sPlayerbotAIConfig.randomBotMaxLevelChance)
          '@
          $text = $text.Replace($roll, $near.TrimEnd())
          $text = $text.Replace('#include "Player.h"', "#include `"Player.h`"`n#include `"Config.h`"")
          Set-Content $file $text -NoNewline

      - name: Free class training on Wildcard (Wildcard.FreeClassTraining, off at 0)
        shell: pwsh
        run: |
          $file = 'core/src/server/coa/AscensionWildcard.cpp'
          $text = (Get-Content $file -Raw) -replace "`r`n", "`n"
          $head = "uint32 TrainerPrice(uint32 spellId, uint32 level)`n{`n"
          if (-not $text.Contains($head)) { throw 'CoA changed: TrainerPrice in AscensionWildcard.cpp was not found' }
          $free = $head + "    if (sConfigMgr->GetOption<bool>(`"Wildcard.FreeClassTraining`", false))`n        return 0;`n"
          Set-Content $file $text.Replace($head, $free) -NoNewline

      - name: Battleground spirit guides raise every ghost beside them at each wave
        shell: pwsh
        run: |
          $file = 'core/src/server/game/Battlegrounds/Battleground.cpp'
          $text = (Get-Content $file -Raw) -replace "`r`n", "`n"
          $wave = "    if (m_LastResurrectTime >= RESURRECTION_INTERVAL)`n    {`n"
          $loop = "                for (ObjectGuid const& guid : itr->second)`n"
          if (-not $text.Contains($wave)) { throw 'Core changed: the resurrection wave in Battleground::_ProcessResurrect was not found' }
          if (-not $text.Contains($loop)) { throw 'Core changed: the revive queue loop in Battleground::_ProcessResurrect was not found' }
          $sweep = @'
                  // Wildcard: a ghost standing at its own team's spirit guide is raised at the wave even if it dropped out of
                  // the queue (players reported needing a second wave, or talking to the guide, in Warsong Gulch).
                  for (auto const& [ghostGuid, ghostEntry] : GetPlayers())
                  {
                      Player* ghost = ObjectAccessor::FindPlayer(ghostGuid);
                      if (!ghost || ghost->IsAlive() || !ghost->HasPlayerFlag(PLAYER_FLAGS_GHOST) || !ghost->IsInWorld())
                          continue;
                      bool queued = false;
                      for (auto const& [queuedGuide, queuedGhosts] : m_ReviveQueue)
                          if (std::find(queuedGhosts.begin(), queuedGhosts.end(), ghostGuid) != queuedGhosts.end())
                              queued = true;
                      if (queued)
                          continue;
                      uint32 const ownGuide = ghost->GetBgTeamId() == TEAM_ALLIANCE ? BG_CREATURE_ENTRY_A_SPIRITGUIDE : BG_CREATURE_ENTRY_H_SPIRITGUIDE;
                      for (ObjectGuid const& creatureGuid : BgCreatures)
                      {
                          Creature* guide = ghost->GetMap()->GetCreature(creatureGuid);
                          if (guide && guide->IsSpiritGuide() && guide->GetEntry() == ownGuide && ghost->IsWithinDistInMap(guide, 30.0f))
                          {
                              m_ReviveQueue[guide->GetGUID()].push_back(ghostGuid);
                              break;
                          }
                      }
                  }
          '@
          $text = $text.Replace($wave, $wave + $sweep.Replace("`r`n", "`n").TrimEnd() + "`n")
          # Walk a copy: removing a ghost from the queue mid-wave must not skip the next one.
          $text = $text.Replace($loop, "                GuidVector const waveGhosts = itr->second;`n                for (ObjectGuid const& guid : waveGhosts)`n")
          Set-Content $file $text -NoNewline

      - name: Place the modules where the core expects them (as the manager's build does)
        shell: pwsh
        run: |
          $dst = 'core/modules/mod-coa-playerbots'
          New-Item -ItemType Directory -Force -Path "$dst/conf" | Out-Null
          Copy-Item -Recurse -Force '_bots/module/src' "$dst/src"
          Copy-Item -Force '_bots/module/conf/*' "$dst/conf/"
          robocopy '_scaling' 'core\modules\mod-coa-content-scaling' /E /XD .git artifacts tools /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "copying mod-coa-content-scaling failed ($LASTEXITCODE)" }
          foreach ($pack in 'mod-coa-tbc-content', 'mod-coa-wotlk-content') {
            robocopy "_scaling\content-packs\$pack" "core\modules\$pack" /E /NFL /NDL /NJH /NJS /NP | Out-Null
            if ($LASTEXITCODE -ge 8) { throw "copying $pack failed ($LASTEXITCODE)" }
          }
          $global:LASTEXITCODE = 0

      - name: Cache Boost and MySQL
        uses: actions/cache@v6
        with:
          path: |
            C:\local\boost_1_87_0
            C:\tools\mysql\current
          key: winbuild-deps:boost-1.87.0:mysql-8.4.9

      - name: Install Boost 1.87 and the MySQL 8.4 client (same versions as the manager's build)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'C:\local\boost_1_87_0\boost')) {
            $boostExe = Join-Path $env:RUNNER_TEMP 'boost.exe'
            $boostUrl = 'https://downloads.sourceforge.net/project/boost/boost-binaries/1.87.0/boost_1_87_0-msvc-14.3-64.exe'
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Invoke-WebRequest -Uri $boostUrl -OutFile $boostExe -UserAgent 'azerothcore-ci' -ConnectionTimeoutSeconds 60 -OperationTimeoutSeconds 60
                if ((Get-Item $boostExe).Length / 1MB -lt 50) { throw 'got an HTML page instead of the installer' }
                break
              } catch {
                Write-Host "Boost download attempt $attempt failed: $($_.Exception.Message)"
                if ($attempt -eq 3) { throw }
                Start-Sleep -Seconds 15
              }
            }
            $proc = Start-Process -FilePath $boostExe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\local\boost_1_87_0' -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "Boost installer failed with exit code $($proc.ExitCode)." }
            if (-not (Test-Path 'C:\local\boost_1_87_0\lib64-msvc-14.3')) { throw 'Boost install is missing its libraries.' }
          }
          if (-not (Test-Path 'C:\tools\mysql\current\lib\mysqlclient.lib')) {
            $zip = Join-Path $env:RUNNER_TEMP 'mysql.zip'
            Invoke-WebRequest -Uri 'https://cdn.mysql.com/archives/mysql-8.4/mysql-8.4.9-winx64.zip' -OutFile $zip -UserAgent 'Mozilla/5.0'
            if ((Get-Item $zip).Length / 1MB -lt 50) { throw 'MySQL download looks wrong.' }
            New-Item -ItemType Directory -Force -Path 'C:\tools\mysql' | Out-Null
            Expand-Archive -Path $zip -DestinationPath 'C:\tools\mysql' -Force
            Rename-Item 'C:\tools\mysql\mysql-8.4.9-winx64' 'C:\tools\mysql\current'
          }
          $openssl = @($env:OPENSSL_ROOT_DIR, 'C:\Program Files\OpenSSL', 'C:\Program Files\OpenSSL-Win64') |
            Where-Object { $_ -and (Test-Path (Join-Path $_ 'include\openssl\opensslv.h')) } | Select-Object -First 1
          if (-not $openssl) { throw 'No OpenSSL development install found on the runner.' }
          "OPENSSL_ROOT_DIR=$openssl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        working-directory: core
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DAPPS_BUILD=all -DTOOLS_BUILD=none `
            -DSCRIPTS=static -DMODULES=static `
            -DUSE_COREPCH=1 -DUSE_SCRIPTPCH=1 `
            "-DBOOST_ROOT=$env:BOOST_ROOT" `
            -DMYSQL_INCLUDE_DIR=C:/tools/mysql/current/include `
            -DMYSQL_LIBRARY=C:/tools/mysql/current/lib/mysqlclient.lib `
            -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR"
          if ($LASTEXITCODE) { throw 'CMake configure failed.' }

      - name: Build worldserver
        shell: pwsh
        working-directory: core
        run: |
          cmake --build build --target worldserver -j 4
          if ($LASTEXITCODE) { throw 'Build failed.' }

      - name: Check it starts and reports its revision
        shell: pwsh
        working-directory: core
        run: |
          $bin = (Get-ChildItem build -Recurse -Filter worldserver.exe | Select-Object -First 1).DirectoryName
          & "$bin\worldserver.exe" --version
          if ($LASTEXITCODE) { throw "worldserver --version exited with $LASTEXITCODE" }
          "BIN_DIR=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package for the VM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ needs.check.outputs.tag }}'
          $out = "coa-wildcard-$tag"
          New-Item -ItemType Directory -Force -Path "$out/server", "$out/addon" | Out-Null
          Copy-Item "$env:BIN_DIR/worldserver.exe" "$out/server/"
          Copy-Item "$env:BIN_DIR/*.dll" "$out/server/" -ErrorAction SilentlyContinue
          Copy-Item -Recurse _mine/addon/WildcardEnchants "$out/addon/"
          Copy-Item _mine/vm/* "$out/"
          @(
            "Manager release: $tag"
            "Core:            Corfirean/azerothcore-wotlk-coa ${{ needs.check.outputs.core_sha }}"
            "CoA bots:        Corfirean/mod-coa-playerbots ${{ needs.check.outputs.bots_sha }}"
            "Content Scaling: Corfirean/mod-coa-content-scaling ${{ needs.check.outputs.scaling_sha }}"
            "SQUID bots:      Zyth45/mod-playerbots ${{ needs.check.outputs.squid_tag }} ${{ needs.check.outputs.squid_sha }}"
            "AI chat:         DustinHendrickson/mod-ollama-chat 906eb2a45f5b3b815a281977005371193517eb32"
            "Patches:         $((Get-ChildItem _mine/patches -Filter *.patch | ForEach-Object Name) -join ', ')"
            "This repository: ${{ github.repository }} ${{ github.sha }}"
            "Built:           $([DateTime]::UtcNow.ToString('u'))"
          ) | Set-Content "$out/BUILD-INFO.txt" -Encoding utf8
          '${{ needs.check.outputs.core_sha }}' | Set-Content "$out/server/core-revision.txt" -Encoding ascii -NoNewline
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip"
          "PACKAGE=$out.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=wcme-$tag-build${{ github.run_number }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish as a release of this repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = (Get-Content (Join-Path ($env:PACKAGE -replace '\.zip$','') 'BUILD-INFO.txt')) -join "`n"
          $notes += "`n`nOn the VM: stop the server in the manager, extract this zip, double-click Install.cmd, start the server."
          gh release create $env:RELEASE_TAG $env:PACKAGE --repo ${{ github.repository }} --target ${{ github.sha }} --title "Wildcard Mystic Enchants for ${{ needs.check.outputs.tag }}" --notes $notes
          if ($LASTEXITCODE) { throw 'Publishing the release failed.' }
